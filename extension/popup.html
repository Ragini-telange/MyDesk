<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyDesk</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>

  <!-- ============================================================
       HEADER — always visible
  ============================================================ -->
  <header class="header">
    <div class="header-logo">
      <svg class="brand-svg-mark" width="24" height="24" viewBox="0 0 32 32" fill="none">
        <path d="M5 26V9.5C5 8.12 6.12 7 7.5 7H8.5C9.4 7 10.2 7.5 10.6 8.3L16 17.5L21.4 8.3C21.8 7.5 22.6 7 23.5 7H24.5C25.88 7 27 8.12 27 9.5V26" stroke="#087E8B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 17.5V26" stroke="#55B8C1" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="8" cy="7" r="1.5" fill="#55B8C1" />
        <circle cx="24" cy="7" r="1.5" fill="#55B8C1" />
      </svg>
      <span class="logo-text">MyDesk</span>
    </div>
    <p class="header-tagline">Plan • Practice • Achieve</p>
  </header>

  <!-- ============================================================
       LOADING SCREEN — shown while checking stored credentials
  ============================================================ -->
  <div id="loading-view" class="view">
    <div class="loading-spinner"></div>
    <p class="loading-text">Connecting to MyDesk…</p>
  </div>

  <!-- ============================================================
       LOGIN FORM — shown when no valid token is stored
  ============================================================ -->
  <div id="login-view" class="view hidden">
    <div class="login-card">
      <div class="login-header-mini">
        <h2 class="login-title">Sign In</h2>
        <p class="login-subtitle">Connect your student workspace</p>
      </div>

      <!-- Error message box -->
      <div id="login-error" class="error-box hidden"></div>

      <label class="input-label" for="email-input">College Email</label>
      <input id="email-input" class="input-field" type="email" placeholder="student@example.com" autocomplete="email" />

      <label class="input-label" for="password-input">Password</label>
      <input id="password-input" class="input-field" type="password" placeholder="Enter password"
        autocomplete="current-password" />

      <button id="login-btn" class="btn btn-primary">Sign In to MyDesk</button>
    </div>
  </div>

  <!-- ============================================================
       DASHBOARD — shown when logged in
  ============================================================ -->
  <div id="dashboard-view" class="view hidden">

    <!-- Student info + logout -->
    <div class="user-bar">
      <div class="user-info">
        <div class="user-avatar-circle">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="user-meta">
          <p id="user-name" class="user-name">Student</p>
          <p id="user-email" class="user-email">—</p>
        </div>
      </div>
      <button id="logout-btn" class="btn btn-ghost" title="Sign out of extension">Logout</button>
    </div>

    <!-- ---- Progress Cards ---- -->
    <section class="section">
      <div class="section-header-row">
        <h3 class="section-title">Your Progress</h3>
      </div>

      <div class="cards-grid">

        <!-- Tasks card -->
        <div class="card">
          <div class="card-icon icon-teal">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div class="card-body">
            <p class="card-label">Tasks Done</p>
            <p class="card-value">
              <span id="tasks-completed">—</span>
              <span class="card-total"> / <span id="tasks-total">—</span></span>
            </p>
          </div>
        </div>

        <!-- DSA card -->
        <div class="card">
          <div class="card-icon icon-purple">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
          </div>
          <div class="card-body">
            <p class="card-label">DSA Solved</p>
            <p class="card-value">
              <span id="dsa-solved">—</span>
              <span class="card-total"> / 100</span>
            </p>
          </div>
        </div>

        <!-- GitHub Sync card -->
        <div class="card card-full">
          <div class="card-icon icon-navy">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
            </svg>
          </div>
          <div class="card-body">
            <p class="card-label">GitHub Sync</p>
            <p id="github-status" class="card-value card-value-sm">—</p>
          </div>
        </div>

      </div>
    </section>

    <!-- ---- Quick Links ---- -->
    <section class="section">
      <div class="section-header-row">
        <h3 class="section-title">Quick Access</h3>
      </div>

      <div class="links-list">
        <button class="link-btn" data-path="/dashboard">
          <span class="link-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </span>
          <span class="link-text">Dashboard</span>
          <span class="link-arrow">→</span>
        </button>
        <button class="link-btn" data-path="/todo">
          <span class="link-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 11 12 14 22 4"></polyline>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
          </span>
          <span class="link-text">To-Do Planner</span>
          <span class="link-arrow">→</span>
        </button>
        <button class="link-btn" data-path="/dsa">
          <span class="link-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
          </span>
          <span class="link-text">DSA Practice</span>
          <span class="link-arrow">→</span>
        </button>
        <button class="link-btn" data-path="/interview">
          <span class="link-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
          </span>
          <span class="link-text">Interview Prep</span>
          <span class="link-arrow">→</span>
        </button>
      </div>
    </section>

    <!-- Open MyDesk full website -->
    <button id="open-mydesk-btn" class="btn btn-primary btn-full">
      <span>Open MyDesk Web</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    </button>

  </div>

  <script src="popup.js"></script>
</body>

</html>
